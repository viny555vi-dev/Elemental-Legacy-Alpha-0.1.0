
name: Build Elemental Legacy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Disponibilizar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legacy-JAR
          path: build/libs/*.jar
          if-no-files-found: error
