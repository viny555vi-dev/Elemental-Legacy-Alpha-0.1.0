name: Elemental Legacy VFX Client Smoke
on:
  push:
    branches:
      - 'vfx/**'
permissions:
  contents: read
jobs:
  minecraft-client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libglx-mesa0 mesa-utils libvulkan1 mesa-vulkan-drivers vulkan-tools ffmpeg
      - name: Verify virtual graphics backends
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            glxinfo -B > "$RUNNER_TEMP/glx-info.txt" 2>&1 || true
            vulkaninfo --summary > "$RUNNER_TEMP/vulkan-info.txt" 2>&1
            grep -q "VK_KHR_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -q "VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -E "deviceName|driverName|VK_KHR_surface|VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
          '
      - name: Build mod
        run: gradle clean build --no-daemon --refresh-dependencies --stacktrace
      - name: Start dedicated Minecraft server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-ip=
          server-port=25565
          difficulty=peaceful
          gamemode=creative
          spawn-protection=0
          white-list=false
          enforce-whitelist=false
          view-distance=8
          simulation-distance=4
          max-players=4
          level-name=world
          level-type=minecraft:flat
          generate-structures=false
          enable-rcon=true
          rcon.password=elemental-vfx-ci
          rcon.port=25575
          motd=Elemental Legacy VFX Smoke
          EOF
          nohup gradle runServer --no-daemon --max-workers=2 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 120); do
            if grep -q 'Done (' "$RUNNER_TEMP/server.log"; then
              echo "Dedicated server is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              tail -200 "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 5
          done
          tail -200 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run Minecraft client and record all 24 custom 3D techniques
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: |
          cat > "$RUNNER_TEMP/rcon_smoke.py" <<'PY'
          import socket, struct, time

          def read_packet(sock):
              header = sock.recv(4)
              if len(header) != 4:
                  raise RuntimeError("RCON connection closed before packet header")
              length = struct.unpack("<i", header)[0]
              body = b""
              while len(body) < length:
                  chunk = sock.recv(length - len(body))
                  if not chunk:
                      raise RuntimeError("RCON connection closed while reading packet")
                  body += chunk
              request_id, packet_type = struct.unpack("<ii", body[:8])
              return request_id, packet_type, body[8:-2].decode("utf-8", "replace")

          def packet(request_id, packet_type, text):
              payload = struct.pack("<ii", request_id, packet_type) + text.encode("utf-8") + b"\x00\x00"
              return struct.pack("<i", len(payload)) + payload

          deadline = time.time() + 20
          sock = None
          while time.time() < deadline:
              try:
                  sock = socket.create_connection(("127.0.0.1", 25575), timeout=3)
                  break
              except OSError:
                  time.sleep(1)
          if sock is None:
              raise RuntimeError("Could not connect to the dedicated server RCON")

          with sock:
              sock.settimeout(5)
              sock.sendall(packet(1, 3, "elemental-vfx-ci"))
              auth_id, _, _ = read_packet(sock)
              if auth_id == -1:
                  raise RuntimeError("RCON authentication failed")
              print("RCON authenticated")
              commands = [
                  "execute as Dev run elemental choose ember",
                  "execute as Dev run elemental sync",
                  "time set day",
                  "weather clear",
                  "gamemode creative Dev",
              ]
              for index, command in enumerate(commands, 10):
                  sock.sendall(packet(index, 2, command))
                  response_id, _, response = read_packet(sock)
                  print(f"RCON {command}: {response}")
          PY

          cat > "$RUNNER_TEMP/extract_vfx_evidence.py" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          log_path = root / "client.log"
          video_path = root / "vfx-client-smoke.mp4"
          start_path = root / "capture-start-ms.txt"
          output_dir = root / "vfx-evidence"
          output_dir.mkdir(parents=True, exist_ok=True)

          if not start_path.exists():
              raise SystemExit("Missing video capture start timestamp.")
          capture_start_ms = int(start_path.read_text().strip())
          log_text = log_path.read_text(errors="replace")
          pattern = re.compile(r"PLAYER_MODEL_POSED ([a-z0-9_]+).*?atMs=(\d+).*?camera=([A-Z_]+)")
          entries = []
          seen = set()
          for line in log_text.splitlines():
              match = pattern.search(line)
              if match:
                  ability = match.group(1)
                  if ability not in seen:
                      entries.append((ability, int(match.group(2)), match.group(3)))
                      seen.add(ability)

          if len(entries) != 24:
              raise SystemExit(f"Expected 24 timestamped rendered poses; found {len(entries)}.")

          manifest = ["index\tability\tcamera\tsample_index\toffset_seconds\tvideo_time_seconds\tpose_timestamp_ms"]
          sample_offsets = [0.20, 0.55, 0.90, 1.25, 1.60]
          screenshot_count = 0
          for index, (ability, pose_ms, camera) in enumerate(entries, 1):
              base_time = (pose_ms - capture_start_ms) / 1000.0 + 0.10
              if base_time < 0:
                  raise SystemExit(f"Invalid video offset for {ability}: {base_time:.3f}s")
              for sample_index, offset in enumerate(sample_offsets, 1):
                  video_time = base_time + offset
                  image_path = output_dir / f"{index:02d}_{ability}_{sample_index:02d}.png"
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-ss", f"{video_time:.3f}", "-i", str(video_path),
                      "-frames:v", "1", str(image_path)
                  ], check=True)
                  if not image_path.exists() or image_path.stat().st_size < 1024:
                      raise SystemExit(f"Screenshot {sample_index}/5 was not created for {ability}.")
                  screenshot_count += 1
                  manifest.append(
                      f"{index:02d}\t{ability}\t{camera}\t{sample_index}\t{offset:.2f}\t{video_time:.3f}\t{pose_ms}"
                  )
          (output_dir / "manifest.tsv").write_text("\n".join(manifest) + "\n")
          contact_sheet = output_dir / "timeline-contact.jpg"
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-framerate", "1", "-pattern_type", "glob",
              "-i", str(output_dir / "*.png"),
              "-vf", "scale=320:180,tile=5x24",
              "-frames:v", "1", str(contact_sheet)
          ], check=True)
          if screenshot_count != 120 or not contact_sheet.exists() or contact_sheet.stat().st_size < 1024:
              raise SystemExit(f"Incomplete animation timeline evidence: {screenshot_count}/120.")
          print(f"Timestamped animation timelines: {screenshot_count}/120 screenshots generated; 24x5 contact sheet ready.")
          PY

          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            export SDL_VIDEODRIVER=x11
            export ALSOFT_DRIVERS=null

            date +%s%3N > "$RUNNER_TEMP/capture-start-ms.txt"
            ffmpeg -y -f x11grab -framerate 20 -video_size 1280x720 -i "$DISPLAY" -t 165 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$RUNNER_TEMP/vfx-client-smoke.mp4" > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &
            CAPTURE_PID=$!
            timeout 165s gradle runClient -PelementalSmoke --no-daemon --max-workers=2 --stacktrace > "$RUNNER_TEMP/client.log" 2>&1 &
            CLIENT_PID=$!

            # Dismiss the first-run accessibility welcome screen before quick-play connects.
            for i in $(seq 1 60); do
              if grep -q "Setting user:" "$RUNNER_TEMP/client.log"; then
                sleep 8
                xdotool key --clearmodifiers Tab Tab Tab Tab Return
                sleep 5
                break
              fi
              sleep 1
            done

            JOINED=0
            for i in $(seq 1 100); do
              if grep -E "Dev.*(joined the game|logged in with entity id)" "$RUNNER_TEMP/server.log" >/dev/null; then
                JOINED=1
                echo "Client successfully joined the dedicated Minecraft 26.3 server."
                break
              fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ "$JOINED" -eq 1 ]; then
              python3 "$RUNNER_TEMP/rcon_smoke.py"
              # The smoke client selects a stable front/back third-person angle per technique.
            fi

            wait "$CLIENT_PID"
            CLIENT_RC=$?
            wait "$CAPTURE_PID"

            echo "Client process exit: $CLIENT_RC"
            echo "Server login detected: $JOINED"
            if [ "$JOINED" -ne 1 ]; then
              exit 21
            fi
            if ! grep -q "COMPLETED: all 24 techniques rendered" "$RUNNER_TEMP/client.log"; then
              echo "The client did not complete the 24-technique visual sequence."
              exit 22
            fi
            if ! grep -q "SubmitCustomGeometryEvent is rendering custom meshes" "$RUNNER_TEMP/client.log"; then
              echo "The custom geometry render event was not observed."
              exit 23
            fi
            MESH_COUNT=$(grep -c "MESH_SUBMIT " "$RUNNER_TEMP/client.log" || true)
            POSE_COUNT=$(grep -c "PLAYER_MODEL_POSED " "$RUNNER_TEMP/client.log" || true)
            echo "Unique technique meshes submitted: $MESH_COUNT/24"
            echo "Unique fully articulated (arms + torso + stance) poses verified: $POSE_COUNT/24"
            if [ "$MESH_COUNT" -ne 24 ]; then
              echo "Not all 24 technique meshes reached the custom geometry collector."
              exit 24
            fi
            if [ "$POSE_COUNT" -ne 24 ]; then
              echo "Not all 24 techniques passed the arm, torso, stance and distinctness checks."
              exit 25
            fi
            if [ "$CLIENT_RC" -ne 0 ] && [ "$CLIENT_RC" -ne 124 ]; then
              exit "$CLIENT_RC"
            fi
          '
          XVFB_RC=$?
          echo "xvfb/client wrapper exit: $XVFB_RC"
          python3 "$RUNNER_TEMP/extract_vfx_evidence.py" "$RUNNER_TEMP"
          EVIDENCE_RC=$?
          if [ "$EVIDENCE_RC" -ne 0 ] && [ "$XVFB_RC" -eq 0 ]; then XVFB_RC="$EVIDENCE_RC"; fi
          test -s "$RUNNER_TEMP/vfx-client-smoke.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/vfx-client-smoke.mp4"
          grep -E 'ELEMENTAL_VFX_SMOKE|Minecraft|NeoForge|Elemental Legacy|Connecting|joined the game|logged in' "$RUNNER_TEMP/client.log" | tail -120 || true
          grep -E 'Dev.*(logged in with entity id|joined the game)' "$RUNNER_TEMP/server.log" | tail -20 || true
          exit "$XVFB_RC"
      - name: Upload client recording, logs and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legacy-VFX-Client-Smoke
          path: |
            build/libs/*.jar
            ${{ runner.temp }}/vfx-client-smoke.mp4
            ${{ runner.temp }}/client.log
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/ffmpeg.log
            ${{ runner.temp }}/glx-info.txt
            ${{ runner.temp }}/vulkan-info.txt
            ${{ runner.temp }}/vfx-evidence/
          if-no-files-found: warn
