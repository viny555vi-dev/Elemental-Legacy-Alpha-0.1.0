name: Elemental Legacy VFX Client Smoke
on:
  push:
    branches:
      - 'vfx/**'
permissions:
  contents: read
jobs:
  minecraft-client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libglx-mesa0 mesa-utils libvulkan1 mesa-vulkan-drivers vulkan-tools ffmpeg
      - name: Verify virtual graphics backends
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            glxinfo -B > "$RUNNER_TEMP/glx-info.txt" 2>&1 || true
            vulkaninfo --summary > "$RUNNER_TEMP/vulkan-info.txt" 2>&1
            grep -q "VK_KHR_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -q "VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -E "deviceName|driverName|VK_KHR_surface|VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
          '
      - name: Build mod
        run: gradle clean build --no-daemon --refresh-dependencies --stacktrace
      - name: Start dedicated Minecraft server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-ip=
          server-port=25565
          difficulty=peaceful
          gamemode=creative
          spawn-protection=0
          white-list=false
          enforce-whitelist=false
          view-distance=8
          simulation-distance=4
          max-players=4
          level-name=world
          level-type=minecraft:flat
          generate-structures=false
          enable-rcon=true
          rcon.password=elemental-vfx-ci
          rcon.port=25575
          motd=Elemental Legacy VFX Smoke
          EOF
          nohup gradle runServer -PelementalSmoke --no-daemon --max-workers=2 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 120); do
            if grep -q 'Done (' "$RUNNER_TEMP/server.log"; then
              echo "Dedicated server is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              tail -200 "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 5
          done
          tail -200 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run Minecraft client and record all 24 custom 3D techniques
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: |
          cat > "$RUNNER_TEMP/rcon_smoke.py" <<'PY'
          import os, pathlib, socket, struct, time

          def read_packet(sock):
              header = sock.recv(4)
              if len(header) != 4:
                  raise RuntimeError("RCON connection closed before packet header")
              length = struct.unpack("<i", header)[0]
              body = b""
              while len(body) < length:
                  chunk = sock.recv(length - len(body))
                  if not chunk:
                      raise RuntimeError("RCON connection closed while reading packet")
                  body += chunk
              request_id, packet_type = struct.unpack("<ii", body[:8])
              return request_id, packet_type, body[8:-2].decode("utf-8", "replace")

          def packet(request_id, packet_type, text):
              payload = struct.pack("<ii", request_id, packet_type) + text.encode("utf-8") + b"\x00\x00"
              return struct.pack("<i", len(payload)) + payload

          deadline = time.time() + 20
          sock = None
          while time.time() < deadline:
              try:
                  sock = socket.create_connection(("127.0.0.1", 25575), timeout=3)
                  break
              except OSError:
                  time.sleep(1)
          if sock is None:
              raise RuntimeError("Could not connect to the dedicated server RCON")

          with sock:
              sock.settimeout(5)
              sock.sendall(packet(1, 3, "elemental-vfx-ci"))
              auth_id, _, _ = read_packet(sock)
              if auth_id == -1:
                  raise RuntimeError("RCON authentication failed")
              print("RCON authenticated")
              commands = [
                  "execute as Dev run elemental choose stone",
                  "execute as Dev run elemental sync",
                  "time set day",
                  "weather clear",
                  "gamemode creative Dev",
                  # Stable pool beside the caster: the water_projectile sample validates proximity affinity.
                  "execute at Dev run fill ~1 ~-1 ~-3 ~6 ~-1 ~3 minecraft:water",
              ]
              for index, command in enumerate(commands, 10):
                  sock.sendall(packet(index, 2, command))
                  response_id, _, response = read_packet(sock)
                  print(f"RCON {command}: {response}")

              # Wait until the client-only 24-technique timeline is complete so the
              # server-authoritative Stone actions can be captured separately.
              client_log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "client.log"
              deadline = time.time() + 160
              while time.time() < deadline:
                  try:
                      completed = "COMPLETED: all 24 techniques rendered" in client_log.read_text(errors="replace")
                  except FileNotFoundError:
                      completed = False
                  if completed:
                      break
                  time.sleep(2)
              else:
                  raise RuntimeError("Client visual sequence did not complete before Stone server smoke.")

              print("Client visual sequence complete; executing all six server-authoritative Stone techniques.")
              stone_abilities = [
                  ("rock_throw", 5),
                  ("stone_wall", 13),
                  ("rock_cage", 15),
                  ("seismic_wave", 13),
                  ("stone_armor", 17),
                  ("earthquake", 4),
              ]
              for index, (ability, delay) in enumerate(stone_abilities, 100):
                  command = f"execute as Dev run elemental use {ability}"
                  sock.sendall(packet(index, 2, command))
                  response_id, _, response = read_packet(sock)
                  print(f"STONE RCON {ability}: {response}")
                  if "executada" not in response.lower():
                      raise RuntimeError(f"Stone technique {ability} was rejected: {response}")
                  time.sleep(delay)
              print("STONE_SERVER_SMOKE_COMPLETE 6/6")
          PY

          cat > "$RUNNER_TEMP/extract_vfx_evidence.py" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          log_path = root / "client.log"
          video_path = root / "vfx-client-smoke.mp4"
          start_path = root / "capture-start-ms.txt"
          output_dir = root / "vfx-evidence"
          output_dir.mkdir(parents=True, exist_ok=True)

          if not start_path.exists():
              raise SystemExit("Missing video capture start timestamp.")
          capture_start_ms = int(start_path.read_text().strip())
          log_text = log_path.read_text(errors="replace")
          pattern = re.compile(
              r"PLAYER_MODEL_POSE_SAMPLE ([a-z0-9_]+) sample=(\d+)/5 progress=([0-9.]+) "
              r"atMs=(\d+).*?camera=([A-Z_]+)"
          )
          ability_order = []
          samples_by_ability = {}
          for line in log_text.splitlines():
              match = pattern.search(line)
              if not match:
                  continue
              ability, sample_text, progress_text, timestamp_text, camera = match.groups()
              if ability not in samples_by_ability:
                  ability_order.append(ability)
                  samples_by_ability[ability] = {}
              sample_index = int(sample_text)
              samples_by_ability[ability][sample_index] = (
                  int(timestamp_text), float(progress_text), camera
              )

          if len(ability_order) != 24:
              raise SystemExit(
                  f"Expected pose timelines for 24 techniques; found {len(ability_order)}."
              )
          incomplete = {
              ability: sorted(set(range(1, 6)) - set(samples))
              for ability, samples in samples_by_ability.items()
              if set(samples) != set(range(1, 6))
          }
          if incomplete:
              raise SystemExit(f"Missing full-animation pose samples: {incomplete}")

          manifest = [
              "index\tability\tcamera\tsample_index\tprogress\tvideo_time_seconds\tpose_timestamp_ms"
          ]
          screenshot_count = 0
          for index, ability in enumerate(ability_order, 1):
              for sample_index in range(1, 6):
                  pose_ms, progress, camera = samples_by_ability[ability][sample_index]
                  video_time = (pose_ms - capture_start_ms) / 1000.0 + 0.10
                  if video_time < 0:
                      raise SystemExit(
                          f"Invalid video offset for {ability} sample {sample_index}: {video_time:.3f}s"
                      )
                  image_path = output_dir / f"{index:02d}_{ability}_{sample_index:02d}.png"
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-ss", f"{video_time:.3f}", "-i", str(video_path),
                      "-frames:v", "1", str(image_path)
                  ], check=True)
                  if not image_path.exists() or image_path.stat().st_size < 1024:
                      raise SystemExit(f"Screenshot {sample_index}/5 was not created for {ability}.")
                  screenshot_count += 1
                  manifest.append(
                      f"{index:02d}\t{ability}\t{camera}\t{sample_index}\t{progress:.3f}\t"
                      f"{video_time:.3f}\t{pose_ms}"
                  )
          (output_dir / "manifest.tsv").write_text("\n".join(manifest) + "\n")
          contact_sheet = output_dir / "timeline-contact.jpg"
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-framerate", "1", "-pattern_type", "glob",
              "-i", str(output_dir / "*.png"),
              "-vf", "scale=320:180,tile=5x24",
              "-frames:v", "1", str(contact_sheet)
          ], check=True)
          if screenshot_count != 120 or not contact_sheet.exists() or contact_sheet.stat().st_size < 1024:
              raise SystemExit(f"Incomplete animation timeline evidence: {screenshot_count}/120.")
          print(f"Timestamped animation timelines: {screenshot_count}/120 screenshots generated; 24x5 contact sheet ready.")

          # The second pass captures the six techniques triggered through the real server command path.
          server_log = root / "server.log"
          server_text = server_log.read_text(errors="replace") if server_log.exists() else ""
          stone_pattern = re.compile(
              r"\[ELEMENTAL_STONE_SMOKE\] ABILITY_START ([a-z0-9_]+) atMs=(\d+)"
          )
          stone_starts = {}
          for ability, timestamp in stone_pattern.findall(server_text):
              stone_starts[ability] = int(timestamp)

          stone_order = [
              "rock_throw", "stone_wall", "rock_cage",
              "seismic_wave", "stone_armor", "earthquake"
          ]
          if set(stone_starts) != set(stone_order):
              raise SystemExit(
                  f"Expected six server-authoritative Stone activations; found {sorted(stone_starts)}"
              )

          stone_dir = root / "stone-server-evidence"
          stone_dir.mkdir(parents=True, exist_ok=True)
          stone_offsets = (0.20, 0.55, 0.90, 1.25, 1.65)
          stone_manifest = [
              "index\tability\tsample_index\tvideo_time_seconds\tserver_start_ms"
          ]
          stone_screenshot_count = 0
          for index, ability in enumerate(stone_order, 1):
              for sample_index, offset in enumerate(stone_offsets, 1):
                  video_time = (stone_starts[ability] - capture_start_ms) / 1000.0 + offset
                  if video_time < 0 or video_time > 255:
                      raise SystemExit(
                          f"Invalid Stone server evidence offset for {ability}: {video_time:.3f}s"
                      )
                  image_path = stone_dir / f"{index:02d}_{ability}_server_{sample_index:02d}.png"
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-ss", f"{video_time:.3f}", "-i", str(video_path),
                      "-frames:v", "1", str(image_path)
                  ], check=True)
                  if not image_path.exists() or image_path.stat().st_size < 1024:
                      raise SystemExit(f"Server Stone screenshot missing: {ability} {sample_index}/5")
                  stone_screenshot_count += 1
                  stone_manifest.append(
                      f"{index:02d}\t{ability}\t{sample_index}\t{video_time:.3f}\t{stone_starts[ability]}"
                  )

          (stone_dir / "manifest.tsv").write_text("\n".join(stone_manifest) + "\n")
          stone_contact = stone_dir / "timeline-contact.jpg"
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-framerate", "1", "-pattern_type", "glob",
              "-i", str(stone_dir / "*.png"),
              "-vf", "scale=320:180,tile=5x6",
              "-frames:v", "1", str(stone_contact)
          ], check=True)
          if stone_screenshot_count != 30 or not stone_contact.exists() or stone_contact.stat().st_size < 1024:
              raise SystemExit(
                  f"Incomplete server-authoritative Stone evidence: {stone_screenshot_count}/30."
              )
          print("Server-authoritative Stone timelines: 30/30 screenshots generated; six techniques captured.")
          PY

          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            export SDL_VIDEODRIVER=x11
            export ALSOFT_DRIVERS=null

            date +%s%3N > "$RUNNER_TEMP/capture-start-ms.txt"
            ffmpeg -y -f x11grab -framerate 20 -video_size 1280x720 -i "$DISPLAY" -t 260 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$RUNNER_TEMP/vfx-client-smoke.mp4" > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &
            CAPTURE_PID=$!
            timeout 260s gradle runClient -PelementalSmoke --no-daemon --max-workers=2 --stacktrace > "$RUNNER_TEMP/client.log" 2>&1 &
            CLIENT_PID=$!

            # Dismiss the first-run accessibility welcome screen before quick-play connects.
            for i in $(seq 1 60); do
              if grep -q "Setting user:" "$RUNNER_TEMP/client.log"; then
                sleep 8
                xdotool key --clearmodifiers Tab Tab Tab Tab Return
                sleep 5
                break
              fi
              sleep 1
            done

            JOINED=0
            for i in $(seq 1 100); do
              if grep -E "Dev.*(joined the game|logged in with entity id)" "$RUNNER_TEMP/server.log" >/dev/null; then
                JOINED=1
                echo "Client successfully joined the dedicated Minecraft 26.3 server."
                break
              fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            RCON_RC=0
            if [ "$JOINED" -eq 1 ]; then
              # The RCON script waits for the 24 client poses, then executes the six Stone abilities on the server.
              python3 "$RUNNER_TEMP/rcon_smoke.py" || RCON_RC=$?
            fi

            wait "$CLIENT_PID"
            CLIENT_RC=$?
            wait "$CAPTURE_PID"

            echo "Client process exit: $CLIENT_RC"
            echo "Server login detected: $JOINED"
            if [ "$JOINED" -ne 1 ]; then
              exit 21
            fi
            if [ "$RCON_RC" -ne 0 ]; then
              echo "RCON Stone server smoke failed with exit code $RCON_RC."
              exit 30
            fi
            if ! grep -q "COMPLETED: all 24 techniques rendered" "$RUNNER_TEMP/client.log"; then
              echo "The client did not complete the 24-technique visual sequence."
              exit 22
            fi
            if ! grep -q "SubmitCustomGeometryEvent is rendering custom meshes" "$RUNNER_TEMP/client.log"; then
              echo "The custom geometry render event was not observed."
              exit 23
            fi
            MESH_COUNT=$(grep -c "MESH_SUBMIT " "$RUNNER_TEMP/client.log" || true)
            POSE_COUNT=$(grep -c "PLAYER_MODEL_POSED " "$RUNNER_TEMP/client.log" || true)
            echo "Unique technique meshes submitted: $MESH_COUNT/24"
            echo "Unique fully articulated (arms + torso + stance) poses verified: $POSE_COUNT/24"
            if [ "$MESH_COUNT" -ne 24 ]; then
              echo "Not all 24 technique meshes reached the custom geometry collector."
              exit 24
            fi
            if [ "$POSE_COUNT" -ne 24 ]; then
              echo "Not all 24 techniques passed the arm, torso, stance and distinctness checks."
              exit 25
            fi

            NEAR_WATER_LINE=$(grep -m1 "WATER_AFFINITY water_projectile " "$RUNNER_TEMP/client.log" || true)
            NEAR_WATER_VALUE=$(echo "$NEAR_WATER_LINE" | sed -E "s/.* value=([0-9.]+).*/\\1/")
            if [ -z "$NEAR_WATER_VALUE" ] || ! awk -v value="$NEAR_WATER_VALUE" "BEGIN { exit !(value > 1.10) }"; then
              echo "Water proximity affinity was not validated above the dry baseline: $NEAR_WATER_LINE"
              exit 26
            fi
            for ability in water_whip ice_bind ice_blades water_shield great_wave; do
              if ! grep -q "WATER_AFFINITY $ability value=1.900 swimming=true" "$RUNNER_TEMP/client.log"; then
                echo "Swimming mesh affinity was not validated for $ability."
                exit 27
              fi
              if ! grep -q "PLAYER_ANIMATION_WATER_AFFINITY $ability value=1.900 swimming=true" "$RUNNER_TEMP/client.log"; then
                echo "Swimming pose affinity was not validated for $ability."
                exit 28
              fi
            done
            NEAR_WATER_POSE=$(grep -m1 "PLAYER_ANIMATION_WATER_AFFINITY water_projectile " "$RUNNER_TEMP/client.log" || true)
            NEAR_WATER_POSE_VALUE=$(echo "$NEAR_WATER_POSE" | sed -E "s/.* value=([0-9.]+).*/\\1/")
            if [ -z "$NEAR_WATER_POSE_VALUE" ] || ! awk -v value="$NEAR_WATER_POSE_VALUE" "BEGIN { exit !(value > 1.10) }"; then
              echo "Water proximity affinity was not applied to the player pose: $NEAR_WATER_POSE"
              exit 29
            fi
            echo "Water affinity validated: near-water mesh/pose=$NEAR_WATER_VALUE/$NEAR_WATER_POSE_VALUE; swimming=1.900 for all five remaining Tide meshes and poses."

            STONE_START_COUNT=$(grep -c "\[ELEMENTAL_STONE_SMOKE\] ABILITY_START " "$RUNNER_TEMP/server.log" || true)
            if [ "$STONE_START_COUNT" -ne 6 ]; then
              echo "Expected six server-authoritative Stone abilities, found $STONE_START_COUNT."
              exit 31
            fi
            for ability in rock_throw stone_wall rock_cage seismic_wave stone_armor earthquake; do
              if ! grep -q "\[ELEMENTAL_STONE_SMOKE\] ABILITY_START $ability " "$RUNNER_TEMP/server.log"; then
                echo "Missing server execution for Stone technique $ability."
                exit 32
              fi
            done
            if ! grep -q "\[ELEMENTAL_STONE_SMOKE\] GROUND_DEBRIS ability=rock_throw" "$RUNNER_TEMP/server.log"; then
              echo "Rock Throw did not emit terrain-textured launch debris."
              exit 33
            fi
            for ability in stone_wall rock_cage seismic_wave earthquake; do
              placed=$(grep -c "\[ELEMENTAL_STONE_SMOKE\] BLOCK_PLACED ability=$ability " "$RUNNER_TEMP/server.log" || true)
              restored=$(grep -c "\[ELEMENTAL_STONE_SMOKE\] BLOCK_RESTORED ability=$ability " "$RUNNER_TEMP/server.log" || true)
              if [ "$placed" -lt 3 ] || [ "$restored" -lt 3 ]; then
                echo "Temporary terrain interaction incomplete for $ability: placed=$placed restored=$restored."
                exit 34
              fi
              echo "Stone terrain $ability: placed=$placed temporary blocks; restored=$restored."
            done
            echo "Stone server validation: 6/6 abilities executed; terrain structures were placed only in air and restored."

            if [ "$CLIENT_RC" -ne 0 ] && [ "$CLIENT_RC" -ne 124 ]; then
              exit "$CLIENT_RC"
            fi
          '
          XVFB_RC=$?
          echo "xvfb/client wrapper exit: $XVFB_RC"
          python3 "$RUNNER_TEMP/extract_vfx_evidence.py" "$RUNNER_TEMP"
          EVIDENCE_RC=$?
          if [ "$EVIDENCE_RC" -ne 0 ] && [ "$XVFB_RC" -eq 0 ]; then XVFB_RC="$EVIDENCE_RC"; fi
          test -s "$RUNNER_TEMP/vfx-client-smoke.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/vfx-client-smoke.mp4"
          grep -E 'ELEMENTAL_VFX_SMOKE|Minecraft|NeoForge|Elemental Legacy|Connecting|joined the game|logged in' "$RUNNER_TEMP/client.log" | tail -120 || true
          grep -E 'Dev.*(logged in with entity id|joined the game)' "$RUNNER_TEMP/server.log" | tail -20 || true
          exit "$XVFB_RC"
      - name: Upload client recording, logs and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legacy-VFX-Client-Smoke
          path: |
            build/libs/*.jar
            ${{ runner.temp }}/vfx-client-smoke.mp4
            ${{ runner.temp }}/client.log
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/ffmpeg.log
            ${{ runner.temp }}/glx-info.txt
            ${{ runner.temp }}/vulkan-info.txt
            ${{ runner.temp }}/vfx-evidence/
            ${{ runner.temp }}/stone-server-evidence/
          if-no-files-found: warn
