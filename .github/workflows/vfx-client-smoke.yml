name: Elemental Legacy VFX Client Smoke
on:
  push:
    branches:
      - 'vfx/**'
permissions:
  contents: read
jobs:
  minecraft-client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libglx-mesa0 mesa-utils libvulkan1 mesa-vulkan-drivers vulkan-tools ffmpeg
      - name: Verify virtual graphics backends
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            glxinfo -B > "$RUNNER_TEMP/glx-info.txt" 2>&1 || true
            vulkaninfo --summary > "$RUNNER_TEMP/vulkan-info.txt" 2>&1
            grep -q "VK_KHR_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -q "VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
            grep -E "deviceName|driverName|VK_KHR_surface|VK_KHR_xlib_surface" "$RUNNER_TEMP/vulkan-info.txt"
          '
      - name: Build mod
        run: gradle clean build --no-daemon --refresh-dependencies --stacktrace
      - name: Start dedicated Minecraft server
        shell: bash
        run: |
          mkdir -p run/server run/client
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-ip=
          server-port=25565
          difficulty=peaceful
          gamemode=creative
          spawn-protection=0
          view-distance=6
          simulation-distance=4
          max-players=4
          motd=Elemental Legacy VFX Smoke
          EOF
          nohup gradle runServer --no-daemon --max-workers=2 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 120); do
            if grep -q 'Done (' "$RUNNER_TEMP/server.log"; then
              echo "Dedicated server is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              tail -200 "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 5
          done
          tail -200 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run client and record all 24 procedural techniques
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: null
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -lc '
            LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" | head -n 1)"
            test -n "$LVP_ICD"
            export VK_ICD_FILENAMES="$LVP_ICD"
            export SDL_VIDEODRIVER=x11
            export ALSOFT_DRIVERS=null
            ffmpeg -y -f x11grab -framerate 20 -video_size 1280x720 -i "$DISPLAY" -t 180 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$RUNNER_TEMP/vfx-client-smoke.mp4" > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &
            CAPTURE_PID=$!
            timeout 180s gradle runClient -PelementalSmoke --no-daemon --max-workers=2 --stacktrace > "$RUNNER_TEMP/client.log" 2>&1 &
            CLIENT_PID=$!

            # First-run accessibility dialog blocks the quick-play action. Dismiss it
            # with a real pointer click, then give quick-play time to join localhost.
            for i in $(seq 1 45); do
              if grep -q "Setting user:" "$RUNNER_TEMP/client.log"; then
                sleep 8
                xdotool mousemove --sync 640 675 click 1
                sleep 2
                xdotool key Return || true
                break
              fi
              sleep 1
            done

            # Wait up to 35 seconds for the client to join the dedicated server.
            JOINED=0
            for i in $(seq 1 35); do
              if grep -q "logged in with entity id\\|joined the game" "$RUNNER_TEMP/server.log"; then
                JOINED=1
                echo "Client successfully joined the test server."
                break
              fi
              sleep 1
            done
            wait "$CLIENT_PID"
            CLIENT_RC=$?
            wait "$CAPTURE_PID"

            echo "Client process exit: $CLIENT_RC"
            echo "Server login detected: $JOINED"
            if [ "$JOINED" -ne 1 ]; then
              exit 21
            fi
            if [ "$CLIENT_RC" -ne 0 ] && [ "$CLIENT_RC" -ne 124 ]; then
              exit "$CLIENT_RC"
            fi
          '
          XVFB_RC=$?
          echo "xvfb/client wrapper exit: $XVFB_RC"
          test -s "$RUNNER_TEMP/vfx-client-smoke.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/vfx-client-smoke.mp4"
          grep -E 'Minecraft|NeoForge|Elemental Legacy|Connecting|Connected|joined the game|logged in' "$RUNNER_TEMP/client.log" | tail -80 || true
          grep -E 'logged in with entity id|joined the game' "$RUNNER_TEMP/server.log" | tail -20 || true
          exit "$XVFB_RC"
      - name: Upload client recording, logs and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legacy-VFX-Client-Smoke
          path: |
            build/libs/*.jar
            ${{ runner.temp }}/vfx-client-smoke.mp4
            ${{ runner.temp }}/client.log
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/ffmpeg.log
            ${{ runner.temp }}/glx-info.txt
            ${{ runner.temp }}/vulkan-info.txt
          if-no-files-found: warn
