name: Build Elemental Legacy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validar ambiente
        run: |
          java -version
          gradle --version

      - name: Compilar NeoForge 26.3.0.95 do zero
        run: gradle clean build --no-daemon --refresh-dependencies --stacktrace

      - name: Disponibilizar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: Elemental-Legacy-JAR
          path: build/libs/*.jar
          if-no-files-found: error
